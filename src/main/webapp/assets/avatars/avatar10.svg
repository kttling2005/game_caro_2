<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cyber Tiger: White Tiger -->
  <defs>
    <radialGradient id="bg10" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#bg10)" stroke="#00e5ff" stroke-width="4"/>
  <!-- Tiger Ears -->
  <polygon points="26,36 22,20 38,26" fill="#ffffff"/>
  <polygon points="28,34 25,24 35,28" fill="#ff4081"/>
  <polygon points="74,36 78,20 62,26" fill="#ffffff"/>
  <polygon points="72,34 75,24 65,28" fill="#ff4081"/>
  <!-- Tiger Face -->
  <circle cx="50" cy="50" r="24" fill="#ffffff"/>
  <!-- Stripes -->
  <path d="M50 30 L48 38 L52 38 Z" fill="#212121"/>
  <path d="M30 46 L38 48 L34 52 Z" fill="#212121"/>
  <path d="M70 46 L62 48 L66 52 Z" fill="#212121"/>
  <!-- Cyber Eye (Left) & Normal Eye (Right) -->
  <ellipse cx="40" cy="48" rx="3.5" ry="3" fill="#00e5ff"/>
  <circle cx="40" cy="48" r="1.5" fill="#ffffff"/>
  <ellipse cx="60" cy="48" rx="3.5" ry="3" fill="#ffd600"/>
  <circle cx="60" cy="48" r="1.5" fill="#212121"/>
  <!-- Nose & Whiskers -->
  <polygon points="47,56 53,56 50,60" fill="#ff4081"/>
  <line x1="30" y1="58" x2="44" y2="58" stroke="#78909c" stroke-width="1.5"/>
  <line x1="70" y1="58" x2="56" y2="58" stroke="#78909c" stroke-width="1.5"/>
</svg>